name: Multi-Model Web Generation & Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated models (e.g. deepseek-flash,gemini-3.8-flash,grok-4.7,claude-sonnet-5-5,gpt-6-1-sol,kimi-k3,kimi-k3-1-pro,muse-spark)'
        required: true
        default: 'deepseek-flash,gemini-3.8-flash,grok-4.7,claude-sonnet-5-5,gpt-6-1-sol,kimi-k3,kimi-k3-1-pro,muse-spark'
        type: string
      prompt_scope:
        description: 'Prompt corpus scope: "all" runs all 47 prompts across 10 categories; "pilot" runs 10 prompts (1 per category); "fullapp" runs the 10 prompts that need accounts, stored content or an admin area'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pilot
          - fullapp
          - custom
      prompts:
        description: 'Custom prompt IDs (only used when prompt_scope is "custom", e.g. plumbing-appointment,minecraft-clone)'
        required: false
        default: ''
        type: string
      harness:
        description: 'Track: pi = model direct (thin clean-room loop); a vendor harness (Claude Code, Codex, Gemini CLI, Qwen Code, Kimi CLI, Muse CLI); acp = all ACP harnesses; vendor = every vendor harness; all = direct + every vendor harness'
        required: true
        default: 'pi'
        type: choice
        options:
          - pi
          - claude-acp
          - codex-acp
          - gemini-acp
          - qwen-acp
          - kimi-acp
          - muse-msp
          - acp
          - vendor
          - all
      mode:
        description: 'Harness mode'
        required: true
        default: 'agent'
        type: choice
        options:
          - agent
          - oneshot
          - both
      spec:
        description: 'Prompt spec mode: freeform (open prompt), guided (reference image + design.md + seed data), or both'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - freeform
          - guided
      reuse_generation_run_id:
        description: 'Optional: Prior workflow Run ID to reuse generated cells from (skips Stage 1 LLM generation)'
        required: false
        default: ''
        type: string
      reuse_audit_run_id:
        description: 'Optional: Prior workflow Run ID to reuse audited shards from (skips Stage 1 & 2 to re-export & publish Pages in ~30s)'
        required: false
        default: ''
        type: string
      bridges:
        description: 'Optional clean-room provider bridges to install (e.g. antigravity)'
        required: false
        default: ''
        type: string
      samples:
        description: 'Repeat samples: 1 = generate each site once. 2 or 3 = also regenerate the first two selected prompts per model and track, to measure run-to-run variation at low cost'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      audit_runs:
        description: 'Browser audit passes per cell (median selected to eliminate VM jitter)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
      audit_runner:
        description: 'Runner label for Stage 2 Chrome/MemLab audits (ubuntu-latest fans out across isolated VMs)'
        required: true
        default: 'ubuntu-latest'
        type: string
      allow_unregistered_models:
        description: 'Allow model selectors that are not in config/models.json (otherwise the planner fails fast on typos)'
        required: false
        default: false
        type: boolean
      outside_testing:
        description: 'Full-app builds only: build and start each generated container, and give each server a temporary public address during its audit so outside services (MDN Observatory, PageSpeed Insights) can test it. Free, not scored'
        required: false
        default: false
        type: boolean
      deploy_pages:
        description: 'Deploy static Benchmark Studio report to GitHub Pages'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  prepare-matrix:
    name: Plan Dynamic Generate & Audit VM Shards
    runs-on: ubuntu-latest
    outputs:
      skip_generate: ${{ steps.plan.outputs.skip_generate }}
      skip_audit: ${{ steps.plan.outputs.skip_audit }}
      generate_shards_json: ${{ steps.plan.outputs.generate_shards_json }}
      audit_shards_json: ${{ steps.plan.outputs.audit_shards_json }}
      total_cells: ${{ steps.plan.outputs.total_cells }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: plan
        env:
          INPUT_MODELS: ${{ inputs.models }}
          INPUT_SCOPE: ${{ inputs.prompt_scope }}
          INPUT_PROMPTS: ${{ inputs.prompts }}
          INPUT_HARNESS: ${{ inputs.harness }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SPEC: ${{ inputs.spec }}
          INPUT_AUDIT_RUNS: ${{ inputs.audit_runs }}
          INPUT_SAMPLES: ${{ inputs.samples }}
          INPUT_REUSE_RUN_ID: ${{ inputs.reuse_generation_run_id }}
          INPUT_REUSE_AUDIT_RUN_ID: ${{ inputs.reuse_audit_run_id }}
          INPUT_ALLOW_UNREGISTERED: ${{ inputs.allow_unregistered_models }}
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            import { planWorkflowShards } from "./src/runner/shard-planner.mjs";

            const reuseAuditRunId = String(process.env.INPUT_REUSE_AUDIT_RUN_ID || "").trim();
            const skipAudit = Boolean(reuseAuditRunId);

            const plan = planWorkflowShards({
              modelsRaw: process.env.INPUT_MODELS,
              promptScope: process.env.INPUT_SCOPE,
              customPromptsRaw: process.env.INPUT_PROMPTS,
              harness: process.env.INPUT_HARNESS || "pi",
              mode: process.env.INPUT_MODE,
              spec: process.env.INPUT_SPEC || "freeform",
              auditRuns: Number(process.env.INPUT_AUDIT_RUNS || 1),
              samples: Number(process.env.INPUT_SAMPLES || 1),
              reuseGenerationRunId: process.env.INPUT_REUSE_RUN_ID || reuseAuditRunId,
              strictModels: String(process.env.INPUT_ALLOW_UNREGISTERED || "false") !== "true",
            });
            for (const u of plan.unknownModels) {
              console.log(`::warning::Model selector "${u.selector}" is not in config/models.json; relying on the pi-ai catalog at runtime.`);
            }
            for (const w of plan.warnings) console.log(`::warning::${w}`);

            const skipGenerate = plan.skipGenerate || skipAudit;
            const genMatrix = skipGenerate
              ? [{ shardId: "skipped", label: "reusing-prior-run", harness: plan.harnesses[0] || "pi", model: plan.models[0], mode: plan.modes[0], spec: plan.specs[0], promptFlag: "" }]
              : plan.generateShards;
            const auditMatrix = skipAudit
              ? [{ shardId: "skipped", label: "reusing-prior-audit-run", harness: plan.harnesses[0] || "pi", model: plan.models[0], mode: plan.modes[0], spec: plan.specs[0], promptFlag: "", artifactPattern: "generated-cells-*" }]
              : plan.auditShards;

            appendFileSync(process.env.GITHUB_OUTPUT, `skip_generate=${skipGenerate ? "true" : "false"}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `skip_audit=${skipAudit ? "true" : "false"}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `generate_shards_json=${JSON.stringify(genMatrix)}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `audit_shards_json=${JSON.stringify(auditMatrix)}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `total_cells=${plan.totalCells}\n`);

            console.log(
              `Planned ${plan.totalCells} cell(s) across harnesses [${plan.harnesses.join(", ")}]: ` +
              `${skipGenerate ? "0 generate shards (reusing prior run)" : `${plan.generateShards.length} parallel generate shard(s)`} -> ` +
              `${skipAudit ? `0 audit shards (reusing audit run ${reuseAuditRunId})` : `${plan.auditShards.length} parallel isolated-VM audit shard(s)`}.`
            );
          '

  # Stage 1: Parallel CPU-light LLM / pi / ACP Agent Generation (Zero Chrome needed)
  generate:
    name: Generate (${{ matrix.shard.label }})
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.skip_generate != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare-matrix.outputs.generate_shards_json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install benchmark dependencies
        run: npm install --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Bootstrap portable pi/ACP runtime & optional provider bridges
        run: |
          if [ -n "${{ inputs.bridges }}" ]; then
            node scripts/setup-vm.mjs --harnesses="${{ matrix.shard.harness }}" --bridges="${{ inputs.bridges }}"
          else
            node scripts/setup-vm.mjs --harnesses="${{ matrix.shard.harness }}"
          fi

      - name: Install Muse CLI for the muse-msp harness (optional, from the MUSE_CLI_INSTALL_CMD repository variable)
        if: ${{ matrix.shard.harness == 'muse-msp' && vars.MUSE_CLI_INSTALL_CMD != '' }}
        env:
          MUSE_CLI_INSTALL_CMD: ${{ vars.MUSE_CLI_INSTALL_CMD }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
        run: |
          bash -c "$MUSE_CLI_INSTALL_CMD"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run clean-room generation shard (${{ matrix.shard.label }})
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_TOKEN_PLAN_API_KEY: ${{ secrets.QWEN_TOKEN_PLAN_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          PI_AUTH_JSON_B64: ${{ secrets.PI_AUTH_JSON_B64 }}
        run: |
          node bin/bench.mjs \
            --stage=generate \
            --force \
            --harness="${{ matrix.shard.harness }}" \
            --mode="${{ matrix.shard.mode }}" \
            --spec="${{ matrix.shard.spec }}" \
            --models="${{ matrix.shard.model }}" \
            ${{ matrix.shard.promptFlag }} ${{ matrix.shard.sampleFlag }}

      - name: Upload generated workspace & pi session artifacts (without node_modules)
        # Upload even when the shard fails or times out so finished cells and session transcripts survive;
        # cells without generation.json are incomplete and skipped by the audit stage.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-cells-${{ matrix.shard.shardId }}
          path: |
            runs/cells/
            !runs/cells/**/node_modules/**
          if-no-files-found: warn
          retention-days: 14

  # Stage 2: Parallel Sharded Isolated-VM Audits (1 dedicated VM per 1–4 cells; concurrency=1 inside each VM; zero LLM keys)
  audit:
    name: Audit (${{ matrix.shard.label }})
    needs: [prepare-matrix, generate]
    if: ${{ !cancelled() && needs.prepare-matrix.result == 'success' && needs.prepare-matrix.outputs.skip_audit != 'true' && (needs.generate.result == 'success' || needs.generate.result == 'skipped' || needs.generate.result == 'failure') }}
    runs-on: ${{ inputs.audit_runner }}
    timeout-minutes: 45
    concurrency:
      group: ${{ inputs.audit_runner == 'ubuntu-latest' && format('audit-vm-{0}-{1}', github.run_id, matrix.shard.shardId) || format('self-hosted-audit-{0}', inputs.audit_runner) }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare-matrix.outputs.audit_shards_json) }}
    env:
      WEB_UPLIFT_NO_SANDBOX: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install benchmark dependencies
        run: npm install --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Bootstrap portable pi & pinned Chrome for Testing
        run: node scripts/setup-vm.mjs --with-chrome

      - name: Download generated cells from this workflow run
        if: ${{ inputs.reuse_generation_run_id == '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.shard.artifactPattern }}
          path: runs/cells/
          merge-multiple: true

      - name: Download generated cells from prior workflow run (${{ inputs.reuse_generation_run_id }})
        if: ${{ inputs.reuse_generation_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.reuse_generation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: generated-cells-*
          path: runs/cells/
          merge-multiple: true

      - name: Fallback to audited-cells-* if prior run was an audit-only run
        id: check_prior_cells
        if: ${{ inputs.reuse_generation_run_id != '' }}
        run: |
          count=0
          if [ -d "runs/cells" ]; then
            count=$(find runs/cells -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          fi
          echo "found_cells=$count" >> "$GITHUB_OUTPUT"

      - name: Download cells from prior audit-only run (${{ inputs.reuse_generation_run_id }})
        if: ${{ inputs.reuse_generation_run_id != '' && steps.check_prior_cells.outputs.found_cells == '0' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.reuse_generation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: audited-cells-*
          path: _prior_audit/
          merge-multiple: true

      - name: Unpack fallback cells & verify non-empty input before auditing
        if: ${{ inputs.reuse_generation_run_id != '' }}
        run: |
          if [ -d "_prior_audit/cells" ]; then
            mkdir -p runs/cells
            cp -rn _prior_audit/cells/* runs/cells/ 2>/dev/null || true
            rm -rf _prior_audit
          fi
          count=0
          if [ -d "runs/cells" ]; then
            count=$(find runs/cells -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::Run ${{ inputs.reuse_generation_run_id }} contained 0 generated or audited cell directories! Pass the original generation Run ID in reuse_generation_run_id."
            exit 1
          fi
          echo "Verified $count cell directory(ies) from run ${{ inputs.reuse_generation_run_id }}."

      - name: Install cloudflared for temporary public addresses (outside testing)
        if: ${{ inputs.outside_testing == true || inputs.outside_testing == 'true' }}
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Run Host Canary + All 5 Benchmark Test Pillars (${{ matrix.shard.label }})
        # Notice: ZERO LLM API keys are passed into this step while executing generated $PORT servers!
        env:
          BENCH_PUBLIC_TUNNEL: ${{ (inputs.outside_testing == true || inputs.outside_testing == 'true') && '1' || '0' }}
        run: |
          node bin/bench.mjs \
            --stage=audit \
            --force \
            --skip-judge \
            --audit-runs="${{ inputs.audit_runs }}" \
            --harness="${{ matrix.shard.harness }}" \
            --mode="${{ matrix.shard.mode }}" \
            --spec="${{ matrix.shard.spec }}" \
            --models="${{ matrix.shard.model }}" \
            ${{ matrix.shard.promptFlag }} ${{ matrix.shard.sampleFlag }}

      - name: Build and start each full-app container to prove the published kit works (outside testing)
        if: ${{ inputs.outside_testing == true || inputs.outside_testing == 'true' }}
        continue-on-error: true
        timeout-minutes: 25
        # No API keys here either: generated code is built and run inside containers bound to loopback.
        run: node scripts/verify-container-kits.mjs runs/cells

      - name: Run Post-Server Multimodal On-Topic LLM Judge (${{ matrix.shard.label }})
        # Runs strictly AFTER all untrusted $PORT servers have exited, evaluating static screenshots & DOM evidence.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
        run: |
          node bin/bench.mjs \
            --judge-only \
            --force \
            --harness="${{ matrix.shard.harness }}" \
            --mode="${{ matrix.shard.mode }}" \
            --spec="${{ matrix.shard.spec }}" \
            --models="${{ matrix.shard.model }}" \
            ${{ matrix.shard.promptFlag }} ${{ matrix.shard.sampleFlag }} \
            --markdown-summary="$GITHUB_STEP_SUMMARY"

      - name: Stage only this shard's audited cells & VM canary telemetry
        env:
          SHARD_ID: ${{ matrix.shard.shardId }}
          SHARD_HARNESS: ${{ matrix.shard.harness }}
          SHARD_MODE: ${{ matrix.shard.mode }}
          SHARD_SPEC: ${{ matrix.shard.spec }}
          SHARD_PROMPT_FLAG: ${{ matrix.shard.promptFlag }}
          SHARD_SAMPLE: ${{ matrix.shard.sample || 1 }}
        run: |
          node --input-type=module -e '
            import { existsSync, readdirSync, readFileSync, rmSync, mkdirSync, cpSync, renameSync, writeFileSync, statSync } from "node:fs";
            import { join } from "node:path";
            import { parseCellDirIdentity } from "./src/harness/generate.mjs";

            const shardId = process.env.SHARD_ID || "shard";
            const shardHarness = process.env.SHARD_HARNESS || "pi";
            const shardMode = process.env.SHARD_MODE || "agent";
            const shardSpec = process.env.SHARD_SPEC || "freeform";
            const shardSample = Number(process.env.SHARD_SAMPLE || 1);
            const promptIds = new Set(
              String(process.env.SHARD_PROMPT_FLAG || "")
                .replace(/^--prompts=/, "")
                .split(",")
                .map((s) => s.trim())
                .filter(Boolean)
            );

            rmSync("_shard_out", { recursive: true, force: true });
            mkdirSync("_shard_out/cells", { recursive: true });
            mkdirSync("_shard_out/canaries", { recursive: true });

            let stagedCount = 0;
            const cellsRoot = "runs/cells";
            if (existsSync(cellsRoot)) {
              for (const entry of readdirSync(cellsRoot)) {
                const cellDir = join(cellsRoot, entry);
                if (!statSync(cellDir).isDirectory()) continue;
                let gen = {};
                const genFile = join(cellDir, "generation.json");
                if (existsSync(genFile)) {
                  try { gen = JSON.parse(readFileSync(genFile, "utf8")); } catch {}
                }
                const parsed = parseCellDirIdentity(entry, gen);
                const promptId = gen.promptId || entry.split("__")[1] || "";
                if (
                  parsed.harness !== shardHarness ||
                  parsed.mode !== shardMode ||
                  parsed.spec !== shardSpec ||
                (parsed.sample || 1) !== shardSample ||
                  (promptIds.size > 0 && !promptIds.has(promptId))
                ) {
                  continue;
                }
                // Cells whose generation failed (bad key, harness refused the model, timeout) are kept too,
                // so a broken lane shows up in the report with its error instead of silently disappearing.
                if (
                  !gen.error &&
                  !existsSync(join(cellDir, "results")) &&
                  !existsSync(join(cellDir, "materialization.json")) &&
                  !existsSync(join(cellDir, "audit-telemetry.json"))
                ) {
                  continue;
                }

                for (const sub of ["agent-workspace/node_modules", "extracted/node_modules", ".tmp-heapsnapshots"]) {
                  const fullSub = join(cellDir, sub);
                  if (existsSync(fullSub)) rmSync(fullSub, { recursive: true, force: true });
                }
                renameSync(cellDir, join("_shard_out/cells", entry));
                stagedCount++;
              }
            }

            if (existsSync("data/canary-latest.json")) {
              cpSync("data/canary-latest.json", join("_shard_out/canaries", `canary-${shardId}.json`));
            }

            writeFileSync(
              "_shard_out/shard-meta.json",
              JSON.stringify({ shardId, stagedCount, finishedAt: new Date().toISOString() }, null, 2) + "\n"
            );
            console.log(`Staged ${stagedCount} audited cell(s) for shard ${shardId}.`);
          '

      - name: Upload audited cell shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: audited-cells-${{ matrix.shard.shardId }}
          path: _shard_out/
          if-no-files-found: warn
          retention-days: 14

  # Stage 3: Fast Aggregation, Leaderboard Step Summary & Static Benchmark Studio Export (~20s)
  aggregate-and-report:
    name: Aggregate All Shards & Export Benchmark Studio
    needs: [prepare-matrix, audit]
    if: ${{ !cancelled() && needs.prepare-matrix.result == 'success' && (needs.audit.result == 'success' || needs.audit.result == 'failure' || needs.audit.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install benchmark dependencies
        run: npm install --no-package-lock --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Download all audited cell shards from this workflow run
        if: ${{ inputs.reuse_audit_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: audited-cells-*
          path: runs/
          merge-multiple: true

      - name: Download all audited cell shards from prior workflow run (${{ inputs.reuse_audit_run_id }})
        if: ${{ inputs.reuse_audit_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.reuse_audit_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: audited-cells-*
          path: runs/
          merge-multiple: true

      - name: Restore representative Host Canary & aggregate full leaderboard
        run: |
          node --input-type=module -e '
            import { existsSync, readdirSync, cpSync, mkdirSync } from "node:fs";
            import { join } from "node:path";
            if (existsSync("runs/canaries")) {
              const files = readdirSync("runs/canaries").filter((f) => f.endsWith(".json")).sort();
              if (files.length > 0) {
                mkdirSync("data", { recursive: true });
                cpSync(join("runs/canaries", files[0]), "data/canary-latest.json");
              }
            }
          '
          node bin/bench.mjs --score-only --markdown-summary="$GITHUB_STEP_SUMMARY"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const summary = JSON.parse(readFileSync("data/summary.json", "utf8"));
            const cells = summary?.totals?.cells || 0;
            if (cells === 0) {
              console.error("::error::Aggregated 0 audited cells! Check reuse_audit_run_id / reuse_generation_run_id — refusing to overwrite GitHub Pages with an empty report.");
              process.exit(1);
            }
            console.log(`Verified ${cells} scored cell(s) ready for Benchmark Studio export.`);
            // One line per site that failed, so a broken lane can be read from the end of this log.
            const failed = (summary.cells || []).filter((c) => c.generationError || c.buildSucceeded === false);
            console.log(`Lane status: ${(summary.cells || []).length - failed.length} site(s) built, ${failed.length} failed.`);
            for (const c of failed) {
              const why = c.generationError || c.auditTelemetry?.error || c.materializationError || "did not build";
              console.log(`  FAILED ${c.cellId}: ${String(why).replace(/\s+/g, " ").slice(0, 240)}`);
            }
          '

      - name: Restore earlier runs from the published report (run archive)
        continue-on-error: true
        run: node scripts/fetch-run-archive.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Export static Benchmark Studio report (dist-report/)
        env:
          BENCH_RUN_ID: run-${{ github.run_number }}
        run: |
          export BENCH_RUN_LABEL="$(date -u +%Y-%m-%d) (run ${{ github.run_number }})"
          npm run export

      - name: Upload static Studio report & raw scored artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-studio-report
          path: |
            dist-report/
            data/summary.json
            data/canary-latest.json
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: ${{ inputs.deploy_pages == true || inputs.deploy_pages == 'true' || github.event.inputs.deploy_pages == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-report

  deploy-pages:
    name: Publish Benchmark Studio to GitHub Pages
    needs: aggregate-and-report
    if: ${{ !cancelled() && needs.aggregate-and-report.result == 'success' && (inputs.deploy_pages == true || inputs.deploy_pages == 'true' || github.event.inputs.deploy_pages == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
